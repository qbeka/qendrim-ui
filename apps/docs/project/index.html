    <link rel="preload" href="/src/fonts/GeistSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/Geist-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // A link can carry a recipe and a theme. Set them before the first paint, so the page never flashes the default.
      (function () {
        var skin = new URLSearchParams(location.search).get('skin');
        var match = skin && /^(studio|editorial)-(light|dark)$/.exec(skin);
        if (match) {
          document.documentElement.dataset.qRecipe = match[1];
          document.documentElement.dataset.qTheme = match[2];
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>This page needs JavaScript, and the source and report are at https://github.com/qbeka/qendrim-ui</p></noscript>
    <script type="module" src="/src/project/main.tsx"></script>
  </body>
</html>
